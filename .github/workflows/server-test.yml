name: Server boot test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ultimate-pack/jars
          key: quest-ids-${{ runner.os }}-${{ hashFiles('mods/*.pw.toml', 'pack.toml') }}
          restore-keys: quest-ids-${{ runner.os }}-
      - name: Validate resource IDs, generated book and progression
        run: |
          python3 tools/mod_ids.py
          python3 tools/gen_quests.py --check
          python3 -m unittest discover -s tools -p 'test_*.py' -v
          node --test tools/test_gameplay.mjs
          node --check tools/sample_terrain.js
          find kubejs -name '*.js' -exec node --check {} \;

  boot:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Serve this commit's pack locally
        run: |
          python3 -m http.server 8000 --directory "$GITHUB_WORKSPACE" > /tmp/http.log 2>&1 &
          sleep 2
          curl -fsS http://localhost:8000/pack.toml > /dev/null

      - name: Install server (same script players use)
        env:
          # Use the release asset directly; the old bootstrap's API lookup can 403.
          INSTALLER_URL: https://github.com/packwiz/packwiz-installer/releases/download/v0.5.14/packwiz-installer.jar
          PACKWIZ_BOOTSTRAP_NO_UPDATE: '1'
        run: |
          mkdir -p /tmp/srv
          cp server/start.sh /tmp/srv/
          curl -fsSL --retry 3 -o /tmp/srv/packwiz-installer.jar "$INSTALLER_URL"
          echo "eula=true" > /tmp/srv/eula.txt
          cd /tmp/srv
          # Install + sync only: replace the final exec with a no-op.
          sed 's#^exec ./run.sh nogui#echo installed#' start.sh > install.sh && chmod +x install.sh
          PACK_URL=http://localhost:8000/pack.toml MEMORY=8G ./install.sh
          cp "$GITHUB_WORKSPACE/tools/sample_terrain.js" kubejs/server_scripts/worldgen_sample.js
          # Keep the worldgen smoke test reproducible across runs.
          echo 'level-seed=8675309' >> server.properties
          echo "Mods installed: $(ls mods | wc -l)"
          ls mods

      - name: Boot, run checks, stop
        working-directory: /tmp/srv
        run: |
          mkfifo console.in
          sleep infinity > console.in &
          ./run.sh nogui < console.in > console.log 2>&1 &
          server=$!
          # Never block on the fifo if the server is already gone.
          send() { timeout 5 bash -c 'echo "$1" > console.in' _ "$1" || true; }
          ready=
          for i in $(seq 1 60); do
            if grep -q 'Done (' logs/latest.log 2>/dev/null; then ready=1; break; fi
            if ! kill -0 $server 2>/dev/null; then echo "::error::Server exited during startup"; break; fi
            if ls crash-reports/*.txt >/dev/null 2>&1; then echo "::error::Server crashed during startup"; break; fi
            if [ $((i % 6)) -eq 0 ]; then echo "[$((i*5))s] $(tail -n 1 logs/latest.log 2>/dev/null | cut -c1-200)"; fi
            sleep 5
          done
          if [ -n "$ready" ]; then
            echo "Server ready after ~$((i*5))s"
            sleep 3
            send "ultimate status"
            send "ultimate gate nether open"
            send "ultimate gate nether close"
            send "ultimate arrival"
            send "ultimate terrain"
            send "ultimate_terrain_sample"
            # Exercise separated terrain regions and all three dimensions. One
            # spawn-sized square cannot establish worldgen compatibility.
            for target in 'minecraft:overworld 0 0' 'minecraft:overworld 2048 2048' 'minecraft:overworld -2048 -2048' 'minecraft:the_nether 0 0' 'minecraft:the_end 1600 0'; do
              read -r dimension center_x center_z <<< "$target"
              first_line=$(( $(wc -l < console.log) + 1 ))
              send "chunky world $dimension"
              send "chunky shape square"
              send "chunky center $center_x $center_z"
              send "chunky radius 64"
              send "chunky start"
              finished=
              for j in $(seq 1 60); do
                if tail -n +"$first_line" console.log | grep -F "Task finished for $dimension." > /dev/null; then finished=1; break; fi
                kill -0 $server 2>/dev/null || break
                ls crash-reports/*.txt >/dev/null 2>&1 && break
                grep -qE 'Feature order cycle|Exception generating new chunk|Error executing task on Chunk source' console.log && break
                sleep 5
              done
              if [ -z "$finished" ]; then
                echo "::error::Chunk generation did not finish for $target"
                touch worldgen.failed
                break
              fi
              echo "$target" >> worldgen-passed.txt
            done
            send "stop"
          else
            send "stop"
          fi
          for i in $(seq 1 60); do kill -0 $server 2>/dev/null || break; sleep 2; done
          kill -9 $server 2>/dev/null || true
          tail -n 60 console.log

      - name: Check results
        working-directory: /tmp/srv
        run: |
          status=0
          if ! grep -q 'Done (' logs/latest.log; then
            echo "::error::Server did not finish starting"; status=1
          fi
          if ls crash-reports/*.txt >/dev/null 2>&1; then
            echo "::error::Crash report written"; cat crash-reports/*.txt | head -100; status=1
          fi
          if [ -f worldgen.failed ] || [ "$(wc -l < worldgen-passed.txt 2>/dev/null || echo 0)" -ne 5 ]; then
            echo "::error::Not all five worldgen regions completed"; status=1
          fi
          if grep -E 'Feature order cycle|Exception generating new chunk|Error executing task on Chunk source|Failed to load registries' logs/latest.log; then
            echo "::error::World generation reported a failure"; status=1
          fi
          if ! grep -q 'Tectonic terrain pack enabled' console.log; then
            echo "::error::Tectonic terrain pack is not active"; status=1
          fi
          if ! grep -q 'ULTIMATE_TERRAIN_SAMPLE ' console.log; then
            echo "::error::Terrain height sampling did not finish"; status=1
          fi
          for f in logs/kubejs/*.log; do
            echo "===== $f"
            cat "$f"
            if grep -E '\[(ERROR|ERR)' "$f"; then
              echo "::error file=$f::KubeJS reported errors"; status=1
            fi
          done
          echo "===== ultimate status / gate output"
          grep -E 'nether|end:|Phase|has been|return gate|ender dragon|arrival' console.log || true
          if ! grep -q 'End arrival island' console.log; then
            echo "::error::/ultimate arrival did not answer (End arrival search broken?)"; status=1
          fi
          if grep -qE 'An unexpected error occurred|Error executing command' console.log; then
            echo "::error::A command threw an error"; grep -E -A3 'An unexpected error occurred|Error executing command' console.log; status=1
          fi
          echo "===== FTB Quests"
          grep -i 'ftbquests\|ftb quests' logs/latest.log | head -40 || true
          echo "===== Warnings/errors in latest.log (first 150)"
          grep -E '/(ERROR|WARN)\]' logs/latest.log | head -150 || true
          exit $status

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: server-logs
          path: |
            /tmp/srv/logs/
            /tmp/srv/crash-reports/
            /tmp/srv/console.log
            /tmp/srv/worldgen-passed.txt
            /tmp/srv/config/
          if-no-files-found: ignore
