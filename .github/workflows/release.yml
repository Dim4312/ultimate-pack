name: Release zips

# Builds three ready-to-play zips with every mod already inside and attaches them to the release:
#   UltimatePack-client.zip  Prism instance (import it), client mods included, still auto-updates on launch
#   UltimatePack-server.zip  server folder with server mods; start.sh / start.bat install NeoForge and keep it synced
#   UltimatePack-solo.zip    Prism instance with client AND server mods, for singleplayer testing without a server.
#                            A fixed snapshot of this tag: it never auto-updates. Chunky is left out (it crashes
#                            Distant Horizons in singleplayer).
# Tags with a dash (v0.5.0-test.1) are test builds: a pre-release whose client and server zips follow the dev branch,
# so friends on main and the "latest" download links are not affected.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build from and upload to (e.g. v0.2.0)
        required: true

permissions:
  contents: write

jobs:
  zips:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
      BOOTSTRAP_URL: https://github.com/packwiz/packwiz-installer-bootstrap/releases/latest/download/packwiz-installer-bootstrap.jar
      INSTALLER_URL: https://github.com/packwiz/packwiz-installer/releases/download/v0.5.14/packwiz-installer.jar
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Pick the branch the zips follow
        run: |
          if [[ "$TAG" == *-* ]]; then echo "BRANCH=dev" >> "$GITHUB_ENV"; echo "PRERELEASE=--prerelease" >> "$GITHUB_ENV"
          else echo "BRANCH=main" >> "$GITHUB_ENV"; echo "PRERELEASE=" >> "$GITHUB_ENV"; fi

      - name: Serve this tag's pack locally
        run: |
          python3 -m http.server 8000 --directory "$GITHUB_WORKSPACE" > /tmp/http.log 2>&1 &
          sleep 2
          curl -fsS http://localhost:8000/pack.toml > /dev/null
          curl -fsSL -o /tmp/bootstrap.jar "$BOOTSTRAP_URL"
          curl -fsSL --retry 3 -o /tmp/installer.jar "$INSTALLER_URL"

      - name: Build client zip
        run: |
          mkdir -p /tmp/client/.minecraft
          cp prism/instance.cfg prism/mmc-pack.json /tmp/client/
          sed -i "s#/ultimate-pack/main/pack.toml#/ultimate-pack/$BRANCH/pack.toml#" /tmp/client/instance.cfg
          cp /tmp/bootstrap.jar /tmp/client/.minecraft/packwiz-installer-bootstrap.jar
          cp /tmp/installer.jar /tmp/client/.minecraft/packwiz-installer.jar
          (cd /tmp/client/.minecraft && java -jar packwiz-installer-bootstrap.jar --bootstrap-no-update -g -s client http://localhost:8000/pack.toml)
          echo "Client mods: $(ls /tmp/client/.minecraft/mods | wc -l)"
          (cd /tmp/client && zip -qr9 /tmp/UltimatePack-client.zip .)

      - name: Build server zip
        run: |
          mkdir -p /tmp/server
          cp server/start.sh server/start.bat /tmp/server/
          sed -i "s#/ultimate-pack/main/pack.toml#/ultimate-pack/$BRANCH/pack.toml#" /tmp/server/start.sh /tmp/server/start.bat
          chmod +x /tmp/server/start.sh
          cp /tmp/bootstrap.jar /tmp/server/packwiz-installer-bootstrap.jar
          cp /tmp/installer.jar /tmp/server/packwiz-installer.jar
          (cd /tmp/server && java -jar packwiz-installer-bootstrap.jar --bootstrap-no-update -g -s server http://localhost:8000/pack.toml)
          echo "Server mods: $(ls /tmp/server/mods | wc -l)"
          (cd /tmp/server && zip -qr9 /tmp/UltimatePack-server.zip .)

      - name: Build solo zip
        run: |
          mkdir -p /tmp/solo/.minecraft
          cp prism/mmc-pack.json /tmp/solo/
          cp prism/instance-solo.cfg /tmp/solo/instance.cfg
          cp /tmp/bootstrap.jar /tmp/solo/.minecraft/packwiz-installer-bootstrap.jar
          cp /tmp/installer.jar /tmp/solo/.minecraft/packwiz-installer.jar
          (cd /tmp/solo/.minecraft && java -jar packwiz-installer-bootstrap.jar --bootstrap-no-update -g -s both http://localhost:8000/pack.toml)
          # Optional add-ons that default to off (shaders) are skipped by a
          # headless install; the solo zip ships them preinstalled.
          for f in $(grep -l '^default = false' mods/*.pw.toml shaderpacks/*.pw.toml); do
            dir=/tmp/solo/.minecraft/$(dirname "$f")
            name=$(grep -m1 '^filename' "$f" | cut -d'"' -f2)
            url=$(grep -m1 '^url' "$f" | cut -d'"' -f2)
            hash=$(grep -m1 '^hash = ' "$f" | cut -d'"' -f2)
            mkdir -p "$dir" && curl -fsSL -o "$dir/$name" "$url"
            echo "$hash  $dir/$name" | sha512sum -c -
          done
          test -n "$(ls /tmp/solo/.minecraft/mods | grep -i iris)"
          chunky=$(grep -m1 '^filename' mods/chunky.pw.toml | cut -d'"' -f2)
          rm -f "/tmp/solo/.minecraft/mods/$chunky" /tmp/solo/.minecraft/packwiz-installer*.jar
          test -n "$(ls /tmp/solo/.minecraft/mods | grep -i distanthorizons)"
          ! ls /tmp/solo/.minecraft/mods | grep -qi chunky
          echo "Solo mods: $(ls /tmp/solo/.minecraft/mods | wc -l)"
          (cd /tmp/solo && zip -qr9 /tmp/UltimatePack-solo.zip .)

      - name: Upload to release
        run: |
          ls -lh /tmp/*.zip
          gh release view "$TAG" > /dev/null 2>&1 || gh release create "$TAG" --title "Ultimate Pack $TAG" --generate-notes --verify-tag $PRERELEASE
          gh release upload "$TAG" /tmp/UltimatePack-client.zip /tmp/UltimatePack-server.zip /tmp/UltimatePack-solo.zip --clobber
